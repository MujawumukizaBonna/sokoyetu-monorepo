services:
  postgres:
    image: postgres:16-alpine
    container_name: sokoyetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sokoyetu
      POSTGRES_USER: sokoyetu
      POSTGRES_PASSWORD: sokoyetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build: .
    container_name: sokoyetu-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sokoyetu:sokoyetu@postgres:5432/sokoyetu
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data: